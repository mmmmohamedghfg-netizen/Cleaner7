          cat > app/src/main/java/com/smartcleaner/app/Fmt.kt <<'EOF'
          package com.smartcleaner.app

          import java.util.Locale

          object Fmt {
              fun size(b: Long): String {
                  if (b < 1024) return "$b B"
                  val units = arrayOf("KB", "MB", "GB", "TB")
                  var v = b.toDouble() / 1024
                  var i = 0
                  while (v >= 1024 && i < units.size - 1) {
                      v /= 1024
                      i++
                  }
                  return String.format(Locale.US, "%.1f %s", v, units[i])
              }

              fun age(ms: Long): String {
                  val d = (System.currentTimeMillis() - ms) / 86400000L
                  return if (d < 1) "اليوم"
                  else if (d < 30) "منذ $d يوم"
                  else if (d < 365) "منذ ${d / 30} شهر"
                  else "منذ ${d / 365} سنة"
              }
          }
          EOF

          cat > app/src/main/java/com/smartcleaner/app/StorageScanner.kt <<'EOF'
          package com.smartcleaner.app

          import java.io.File
          import java.security.MessageDigest

          data class Item(val file: File, val size: Long, val modified: Long)

          class Category(
              val title: String,
              val note: String,
              val items: List<Item>,
              defaultOn: Boolean,
              val safety: Int
          ) {
              val selected: MutableSet<Item> = if (defaultOn) items.toMutableSet() else mutableSetOf()
              fun totalSize(): Long = items.sumOf { it.size }
          }

          object StorageScanner {
              private const val MB = 1024L * 1024L
              private const val DAY = 24L * 60L * 60L * 1000L
              private val junkExt = setOf("tmp", "temp", "log", "bak", "old", "chk", "crdownload", "part")

              fun scan(root: File, onProgress: (String) -> Unit): List<Category> {
                  val junk = ArrayList<Item>()
                  val apks = ArrayList<Item>()
                  val large = ArrayList<Item>()
                  val oldDownloads = ArrayList<Item>()
                  val emptyDirs = ArrayList<Item>()
                  val bySize = HashMap<Long, MutableList<Item>>()
                  val now = System.currentTimeMillis()
                  var count = 0

                  val stack = java.util.ArrayDeque<File>()
                  stack.push(root)
                  while (!stack.isEmpty()) {
                      val dir = stack.pop()
                      val children = dir.listFiles() ?: continue
                      if (children.isEmpty() && dir != root) {
                          emptyDirs.add(Item(dir, 0L, dir.lastModified()))
                          continue
                      }
                      for (f in children) {
                          if (f.isDirectory) {
                              if (f.parentFile == root && f.name == "Android") continue
                              if (java.nio.file.Files.isSymbolicLink(f.toPath())) continue
                              stack.push(f)
                          } else if (f.isFile) {
                              count++
                              if (count % 300 == 0) onProgress("تم فحص $count ملف...")
                              val size = f.length()
                              val item = Item(f, size, f.lastModified())
                              val path = f.absolutePath
                              val ext = f.extension.lowercase()
                              if (ext == "apk") {
                                  apks.add(item)
                              } else if (ext in junkExt || path.contains("/.thumbnails/") || path.contains("/cache/", true)) {
                                  junk.add(item)
                              }
                              if (size >= 100 * MB) large.add(item)
                              if (ext != "apk" && path.contains("/Download/") && now - item.modified > 90 * DAY) {
                                  oldDownloads.add(item)
                              }
                              if (size >= MB) {
                                  bySize.getOrPut(size) { ArrayList() }.add(item)
                              }
                          }
                      }
                  }

                  onProgress("جارٍ البحث عن الملفات المكررة...")
                  val dups = ArrayList<Item>()
                  for (group in bySize.values) {
                      if (group.size < 2) continue
                      if (group[0].size > 1024 * MB) continue
                      val byHash = HashMap<String, MutableList<Item>>()
                      for (x in group) {
                          val h = md5(x.file) ?: continue
                          byHash.getOrPut(h) { ArrayList() }.add(x)
                      }
                      for (g in byHash.values) {
                          if (g.size > 1) {
                              g.sortBy { it.modified }
                              dups.addAll(g.drop(1))
                          }
                      }
                  }

                  return listOfNotNull(
                      mk("ملفات مؤقتة وسجلات", "ملفات تنتجها التطبيقات وغالباً آمنة للحذف", junk, 95),
                      mk("مجلدات فاضية", "مجلدات مفيش فيها أي ملفات", emptyDirs, 90),
                      mk("ملفات مكررة", "نسخ مطابقة تماماً لملفات تانية — بنسيب الأقدم ونحذف النسخ الأحدث", dups, 85),
                      mk("ملفات APK قديمة", "ملفات تثبيت تطبيقات متحتاجهاش بعد التثبيت", apks, 80),
                      mk("تنزيلات قديمة", "ملفات في مجلد التنزيلات أقدم من 3 شهور", oldDownloads, 60),
                      mk("ملفات كبيرة", "ملفات أكبر من 100 ميجا — راجعها واختار بنفسك", large, 30)
                  )
              }

              private fun mk(title: String, note: String, list: List<Item>, safety: Int): Category? {
                  if (list.isEmpty()) return null
                  return Category(title, note, list.sortedByDescending { it.size }, safety >= 80, safety)
              }

              private fun md5(f: File): String? {
                  return try {
                      val md = MessageDigest.getInstance("MD5")
                      f.inputStream().use { s ->
                          val buf = ByteArray(65536)
                          while (true) {
                              val n = s.read(buf)
                              if (n <= 0) break
                              md.update(buf, 0, n)
                          }
                      }
                      md.digest().joinToString("") { "%02x".format(it) }
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/smartcleaner/app/MainActivity.kt <<'EOF'
          package com.smartcleaner.app

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {

              private val main = Handler(Looper.getMainLooper())
              private lateinit var container: LinearLayout
              private var totalLabel: TextView? = null
              private var cats: List<Category> = emptyList()
              private var scanning = false
              private val green = Color.parseColor("#0F9D8A")
              private val gray = Color.parseColor("#666666")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  val scroll = ScrollView(this)
                  container = LinearLayout(this)
                  container.orientation = LinearLayout.VERTICAL
                  container.setPadding(dp(20), dp(40), dp(20), dp(24))
                  scroll.addView(container)
                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  if (!scanning && cats.isEmpty()) showHome()
              }

              // ---------- helpers ----------

              private fun dp(n: Int): Int = (n * resources.displayMetrics.density).toInt()

              private fun tv(t: String, size: Float = 16f, bold: Boolean = false, color: Int = Color.parseColor("#222222")): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = size
                  v.setTextColor(color)
                  if (bold) v.setTypeface(v.typeface, Typeface.BOLD)
                  v.setPadding(0, dp(4), 0, dp(4))
                  return v
              }

              private fun btn(t: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = t
                  b.setTextColor(Color.WHITE)
                  val bg = GradientDrawable()
                  bg.cornerRadius = dp(14).toFloat()
                  bg.setColor(green)
                  b.background = bg
                  b.setOnClickListener { onClick() }
                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  lp.topMargin = dp(10)
                  b.layoutParams = lp
                  return b
              }

              private fun storage(): Pair<Long, Long> {
                  val st = StatFs(Environment.getExternalStorageDirectory().path)
                  return Pair(st.totalBytes, st.availableBytes)
              }

              private fun hasAccess(): Boolean {
                  return if (Build.VERSION.SDK_INT >= 30) {
                      Environment.isExternalStorageManager()
                  } else {
                      ContextCompat.checkSelfPermission(this, Manifest.permission.WRITE_EXTERNAL_STORAGE) ==
                              PackageManager.PERMISSION_GRANTED
                  }
              }

              private fun askAccess() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      } catch (e: Exception) {
                          startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                      }
                  } else {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(
                              Manifest.permission.READ_EXTERNAL_STORAGE,
                              Manifest.permission.WRITE_EXTERNAL_STORAGE
                          ),
                          1
                      )
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  showHome()
              }

              private fun openSettings(action: String) {
                  try {
                      startActivity(Intent(action))
                  } catch (e: Exception) {
                      Toast.makeText(this, "مقدرتش أفتح الإعدادات دي", Toast.LENGTH_SHORT).show()
                  }
              }

              // ---------- screens ----------

              private fun showHome() {
                  totalLabel = null
                  container.removeAllViews()
                  container.addView(tv("🧹 منظف ذكي", 30f, true, green))
                  container.addView(tv("نظّف هاتفك وافضّي مساحة بذكاء", 15f, false, gray))

                  val (total, free) = storage()
                  val used = total - free
                  val pct = if (total > 0) (used * 100 / total).toInt() else 0
                  container.addView(tv("المساحة المستخدمة: ${Fmt.size(used)} من ${Fmt.size(total)} ($pct%)", 16f, true))
                  val bar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  bar.max = 100
                  bar.progress = pct
                  container.addView(bar)
                  container.addView(tv("المتاح: ${Fmt.size(free)}", 15f, false, gray))

                  if (hasAccess()) {
                      container.addView(btn("🔍 فحص ذكي الآن") { startScan() })
                  } else {
                      container.addView(tv("عشان أفحص الملفات محتاج صلاحية الوصول لكل الملفات. بتتفعل من الإعدادات مرة واحدة.", 14
